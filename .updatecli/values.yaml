---
github:
  owner: aacebedo
  repository: copier-templates
  branch: main

miseDeps:
  base:
    - slug: shellcheck
      answerKey: shellcheck_version
      tomlKey: shellcheck
      kind: githubrelease
      owner: koalaman
      repo: shellcheck
      trimPrefix: true
    - slug: editorconfig-checker
      answerKey: editorconfig_checker_version
      tomlKey: '"github:editorconfig-checker/editorconfig-checker"'
      kind: githubrelease
      owner: editorconfig-checker
      repo: editorconfig-checker
      trimPrefix: true
    - slug: trivy
      answerKey: trivy_version
      tomlKey: trivy
      kind: githubrelease
      owner: aquasecurity
      repo: trivy
      trimPrefix: true
    - slug: ryl
      answerKey: ryl_version
      tomlKey: '"github:owenlamont/ryl"'
      kind: githubrelease
      owner: owenlamont
      repo: ryl
      trimPrefix: true
    - slug: prek
      answerKey: prek_version
      tomlKey: prek
      kind: githubrelease
      owner: j178
      repo: prek
      trimPrefix: true
    - slug: shfmt
      answerKey: shfmt_version
      tomlKey: shfmt
      kind: githubrelease
      owner: mvdan
      repo: sh
      trimPrefix: true
    - slug: yamlfmt
      answerKey: yamlfmt_version
      tomlKey: yamlfmt
      kind: githubrelease
      owner: google
      repo: yamlfmt
      trimPrefix: true
    - slug: tombi
      answerKey: tombi_version
      tomlKey: '"github:tombi-toml/tombi"'
      kind: githubrelease
      owner: tombi-toml
      repo: tombi
      trimPrefix: true
    - slug: cocogitto
      answerKey: cocogitto_version
      tomlKey: '"github:cocogitto/cocogitto"'
      kind: githubrelease
      owner: cocogitto
      repo: cocogitto
      trimPrefix: true
    - slug: gh
      answerKey: gh_version
      tomlKey: gh
      kind: githubrelease
      owner: cli
      repo: cli
      trimPrefix: true
    - slug: rumdl
      answerKey: rumdl_version
      tomlKey: rumdl
      kind: githubrelease
      owner: rvben
      repo: rumdl
      trimPrefix: true
    - slug: updatecli
      answerKey: updatecli_version
      tomlKey: updatecli
      kind: githubrelease
      owner: updatecli
      repo: updatecli
      trimPrefix: true
    - slug: codebook
      answerKey: codebook_version
      tomlKey: '"github:blopker/codebook"'
      kind: githubrelease
      owner: blopker
      repo: codebook
      trimPrefix: true
    - slug: biome
      answerKey: biome_version
      tomlKey: biome
      kind: githubrelease
      owner: biomejs
      repo: biome
      trimPrefix: false
      versionfilterRegex: '@biomejs/biome@(\d+\.\d+\.\d+)'
    - slug: uv
      answerKey: uv_version
      tomlKey: uv
      kind: pypi
      name: uv
      trimPrefix: false
    - slug: reuse
      answerKey: reuse_version
      tomlKey: '"pipx:reuse"'
      kind: pypi
      name: reuse
      trimPrefix: false
      inlineTable: true
    - slug: copier
      answerKey: copier_version
      tomlKey: '"pipx:copier"'
      kind: pypi
      name: copier
      trimPrefix: false

templateDefaults:
  # --- base: mise tools ---
  - template: base
    question: shellcheck_version
    kind: githubrelease
    owner: koalaman
    repo: shellcheck
    trimPrefix: true
  - template: base
    question: editorconfig_checker_version
    kind: githubrelease
    owner: editorconfig-checker
    repo: editorconfig-checker
    trimPrefix: true
  - template: base
    question: trivy_version
    kind: githubrelease
    owner: aquasecurity
    repo: trivy
    trimPrefix: true
  - template: base
    question: ryl_version
    kind: githubrelease
    owner: owenlamont
    repo: ryl
    trimPrefix: true
  - template: base
    question: prek_version
    kind: githubrelease
    owner: j178
    repo: prek
    trimPrefix: true
  - template: base
    question: shfmt_version
    kind: githubrelease
    owner: mvdan
    repo: sh
    trimPrefix: true
  - template: base
    question: yamlfmt_version
    kind: githubrelease
    owner: google
    repo: yamlfmt
    trimPrefix: true
  - template: base
    question: tombi_version
    kind: githubrelease
    owner: tombi-toml
    repo: tombi
    trimPrefix: true
  - template: base
    question: cocogitto_version
    kind: githubrelease
    owner: cocogitto
    repo: cocogitto
    trimPrefix: true
  - template: base
    question: gh_version
    kind: githubrelease
    owner: cli
    repo: cli
    trimPrefix: true
  - template: base
    question: rumdl_version
    kind: githubrelease
    owner: rvben
    repo: rumdl
    trimPrefix: true
  - template: base
    question: updatecli_version
    kind: githubrelease
    owner: updatecli
    repo: updatecli
    trimPrefix: true
  - template: base
    question: biome_version
    kind: githubrelease
    owner: biomejs
    repo: biome
    versionfilterRegex: '@biomejs/biome@(\d+\.\d+\.\d+)'
  - template: base
    question: codebook_version
    kind: githubrelease
    owner: blopker
    repo: codebook
    trimPrefix: true
  - template: base
    question: uv_version
    kind: pypi
    name: uv
  - template: base
    question: reuse_version
    kind: pypi
    name: reuse
  - template: base
    question: copier_version
    kind: pypi
    name: copier
  # --- base: CI ---
  - template: base
    question: checkout_action_version
    kind: githubrelease
    owner: actions
    repo: checkout
  - template: base
    question: mise_action_version
    kind: githubrelease
    owner: jdx
    repo: mise-action
  - template: base
    question: devcontainer_image_version
    kind: dockerimage
    image: ghcr.io/aacebedo/devcontainer-base
    tagfilter: '^\d+\.\d+\.\d+$'
  # --- rust ---
  - template: rust
    question: rust_version
    kind: githubrelease
    owner: rust-lang
    repo: rust
  # --- python ---
  - template: python
    question: python_version
    kind: githubrelease
    owner: python
    repo: cpython
    trimPrefix: true
  - template: python
    question: ruff_version
    kind: pypi
    name: ruff
  - template: python
    question: pytest_version
    kind: pypi
    name: pytest
  # --- hugo ---
  - template: hugo
    question: hugo_version
    kind: githubrelease
    owner: gohugoio
    repo: hugo
    trimPrefix: true
  - template: hugo
    question: go_version
    kind: githubrelease
    owner: golang
    repo: go
    versionfilterRegex: '^go(\d+\.\d+\.\d+)$'
  - template: hugo
    question: node_version
    kind: githubrelease
    owner: nodejs
    repo: node
    # Same major pin as the hugo template's own node entry; bump both together.
    versionfilterRegex: '^v(26\.\d+\.\d+)$'
  - template: hugo
    question: djlint_version
    kind: pypi
    name: djlint
  - template: hugo
    question: lighthouse_version
    kind: npm
    name: lighthouse
  - template: hugo
    question: puppeteer_version
    kind: npm
    name: puppeteer
  # --- container ---
  - template: container
    question: hadolint_version
    kind: githubrelease
    owner: hadolint
    repo: hadolint
    trimPrefix: true
  - template: container
    question: dockerfmt_version
    kind: githubrelease
    owner: reteps
    repo: dockerfmt
    trimPrefix: true
