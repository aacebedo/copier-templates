---
- command: |
    if [ -f prek.toml ]; then
      if ! grep -q 'id = "cargo-fmt"' prek.toml; then
        cat >>prek.toml <<'EOF'

    [[repos]]
    repo = "local"

    [[repos.hooks]]
    id = "cargo-fmt"
    name = "cargo fmt"
    entry = "cargo fmt --"
    language = "system"
    types = ["rust"]

    [[repos]]
    repo = "local"

    [[repos.hooks]]
    id = "cargo-clippy"
    name = "cargo clippy"
    entry = "cargo clippy --all-targets -- -D warnings"
    language = "system"
    types = ["rust"]
    pass_filenames = false

    [[repos]]
    repo = "local"

    [[repos.hooks]]
    id = "cargo-check"
    name = "cargo check"
    entry = "cargo check --all-targets"
    language = "system"
    types = ["rust"]
    pass_filenames = false
    EOF
        echo "Added Rust hooks to prek.toml"
      fi
    else
      echo "WARNING: prek.toml not found - apply the 'base' template first," \
        "then re-apply 'rust' to add its pre-commit hooks." >&2
    fi
  when: "{{ template == 'rust' }}"
- command: |
    if [ -f .gitignore ]; then
      if ! grep -qxF '/target' .gitignore; then
        cat >>.gitignore <<'EOF'

    # Rust
    /target
    EOF
        echo "Added Rust ignores to .gitignore"
      fi
    else
      echo "WARNING: .gitignore not found - apply the 'base' template first," \
        "then re-apply 'rust' to add its ignores." >&2
    fi
  when: "{{ template == 'rust' }}"
- command: |
    if [ -f .codebook.toml ]; then
      if ! grep -q '"rustfmt"' .codebook.toml; then
        ADD=$(cat <<'EOF'
      "clippy",
      "rustfmt",
    EOF
    )
        ADD="$ADD" awk '{ print } /^words = \[$/ && !done { print ENVIRON["ADD"]; done = 1 }' \
          .codebook.toml >.codebook.toml.tmp && mv .codebook.toml.tmp .codebook.toml
        echo "Added the Rust vocabulary to .codebook.toml"
      fi
    else
      echo "WARNING: .codebook.toml not found - apply the 'base' template first," \
        "then re-apply 'rust' to add its vocabulary." >&2
    fi
  when: "{{ template == 'rust' }}"
