---
- command: |
    if [ -f prek.toml ]; then
      if ! grep -q 'id = "hadolint"' prek.toml; then
        cat >>prek.toml <<'EOF'

    [[repos]]
    repo = "local"

    [[repos.hooks]]
    id = "hadolint"
    name = "hadolint"
    entry = "hadolint"
    language = "system"
    types = ["dockerfile"]

    [[repos]]
    repo = "local"

    [[repos.hooks]]
    id = "dockerfmt"
    name = "dockerfmt"
    entry = "dockerfmt"
    args = ["--write", "--newline"]
    language = "system"
    types = ["dockerfile"]
    EOF
        echo "Added the hadolint and dockerfmt hooks to prek.toml"
      fi
    else
      echo "WARNING: prek.toml not found - apply the 'base' template first," \
        "then re-apply 'container' to add its pre-commit hook." >&2
    fi
  when: "{{ template == 'container' }}"
- command: |
    pr=.github/workflows/pr.yaml
    if [ -f "$pr" ] && ! grep -q -- '--privileged' "$pr"; then
      opts='--user root --privileged --cgroupns=host --security-opt apparmor=unconfined --device /dev/fuse'
      OPTS="      options: $opts" awk '
        { print }
        /^      image: ghcr\.io\/aacebedo\/devcontainer-base:/ && !done { print ENVIRON["OPTS"]; done = 1 }
      ' "$pr" >"$pr.tmp" && mv "$pr.tmp" "$pr"
      cat >>"$pr" <<'EOF'
          - name: Build and scan the container image
            run: mise run container:run:security-scan
    EOF
      echo "Made $pr's job privileged and added the image scan step"
    fi
  when: "{{ template == 'container' }}"
- command: |
    if [ -f .codebook.toml ]; then
      if ! grep -q '"hadolint"' .codebook.toml; then
        ADD=$(cat <<'EOF'
      "apparmor",
      "cgroupns",
      "dockerfile",
      "dockerfmt",
      "dockerimage",
      "hadolint",
      "nofile",
      "opencontainers",
      "podman",
      "reteps",
      "tagfilter",
      "trivyignore",
      "ulimit",
    EOF
    )
        ADD="$ADD" awk '{ print } /^words = \[$/ && !done { print ENVIRON["ADD"]; done = 1 }' \
          .codebook.toml >.codebook.toml.tmp && mv .codebook.toml.tmp .codebook.toml
        echo "Added the container vocabulary to .codebook.toml"
      fi
    else
      echo "WARNING: .codebook.toml not found - apply the 'base' template first," \
        "then re-apply 'container' to add its vocabulary." >&2
    fi
  when: "{{ template == 'container' }}"
